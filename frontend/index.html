<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KRVE AI Studio</title>

<link rel="stylesheet" href="css/style.css">

<script type="module"
src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<style>

body{
margin:0;
background:#000;
font-family:Arial,Helvetica,sans-serif;
color:white;
}

.container{

max-width:1400px;
margin:auto;
padding:40px;

display:flex;
gap:30px;

}

.left{

width:40%;

background:#0a0a0a;

border:1px solid #d4af37;

padding:30px;

border-radius:12px;

}

.right{

width:60%;

background:#111;

border:1px solid #333;

border-radius:12px;

height:720px;

overflow:hidden;

position:relative;

}

h1{

color:#d4af37;

margin-top:0;

font-size:32px;

}

p{

color:#bbb;

line-height:1.6;

}

label{

display:block;

margin-top:20px;

margin-bottom:8px;

color:#d4af37;

font-size:13px;

font-weight:bold;

}

input{

width:100%;

padding:14px;

background:#111;

color:white;

border:1px solid #d4af37;

border-radius:6px;

box-sizing:border-box;

}

button{

width:100%;

margin-top:30px;

padding:18px;

background:#d4af37;

color:black;

font-weight:bold;

font-size:15px;

border:none;

cursor:pointer;

border-radius:6px;

}

button:hover{

background:#f2cf63;

}

#viewer{

width:100%;

height:720px;

display:flex;

align-items:center;

justify-content:center;

color:#666;

}

#metrics{

margin-top:30px;

padding:20px;

background:#111;

border:1px solid #333;

border-radius:8px;

}

</style>

</head>

<body>

<div class="container">

<div class="left">

<h1>KRVE CORE ENGINE</h1>

<p>

Reconstruct anatomical 3D coordinates based on human dimensions
for accurate apparel draping simulation.

</p>

<label>

YOUR HEIGHT (CM)

</label>

<input
type="number"
id="height"
value="175">

<label>

UPLOAD PHOTO

</label>

<input
type="file"
id="file"
accept="image/*">

<button id="scanBtn">

RECONSTRUCT REAL 3D TWIN

</button>

<div id="metrics">

Waiting for AI Scan...

</div>

</div>

<div class="right">

<div id="viewer">

Waiting for Scan...

</div>

</div>

</div>

<script src="js/script.js"></script>

</body>

</html>
